server.port=8082
spring.application.name=ms-voluntarios

# Base de datos H2 persistente en disco (lista para ejecutar sin configuración adicional)
spring.datasource.url=jdbc:h2:file:./data/voluntarios_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Si deseas conectar a MySQL local, descomenta estas líneas y comenta H2:
